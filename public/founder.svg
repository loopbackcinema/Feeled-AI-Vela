<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="circleView">
            <circle cx="256" cy="256" r="256" />
        </clipPath>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DBEAFE" />
            <stop offset="100%" stop-color="#BFDBFE" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

    <!-- Body/Shirt -->
    <g clip-path="url(#circleView)">
        <!-- Shirt Body -->
        <path d="M100 512 L100 420 C 100 380, 160 360, 256 360 C 352 360, 412 380, 412 420 L 412 512 Z" fill="#FFFFFF" />
        <!-- Shirt Collar -->
        <path d="M256 360 L 200 380 L 256 430 L 312 380 Z" fill="#E2E8F0" />
        <path d="M256 360 L 256 512" stroke="#E2E8F0" stroke-width="2" />
        <!-- Buttons -->
        <circle cx="256" cy="450" r="4" fill="#1E293B" opacity="0.6"/>
        <circle cx="256" cy="490" r="4" fill="#1E293B" opacity="0.6"/>
    </g>

    <!-- Neck -->
    <path d="M210 300 L 210 380 L 302 380 L 302 300" fill="#8D5524" />

    <!-- Head/Face -->
    <ellipse cx="256" cy="240" rx="75" ry="90" fill="#8D5524" />

    <!-- Beard -->
    <path d="M185 220 
             C 185 220, 180 300, 256 340 
             C 332 300, 327 220, 327 220 
             L 327 200 
             C 327 200, 335 250, 256 300
             C 177 250, 185 200, 185 200 Z" fill="#0F172A" />
    
    <!-- Mouth -->
    <path d="M235 285 Q 256 295 277 285" stroke="#3E2723" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Nose -->
    <path d="M256 240 L 246 270 L 266 270 Z" fill="#6D4C41" opacity="0.3"/>

    <!-- Eyes -->
    <g fill="#0F172A">
        <ellipse cx="225" cy="230" rx="8" ry="5" />
        <ellipse cx="287" cy="230" rx="8" ry="5" />
    </g>
    <!-- Eyebrows -->
    <path d="M210 215 Q 225 210 240 215" stroke="#0F172A" stroke-width="4" fill="none"/>
    <path d="M272 215 Q 287 210 302 215" stroke="#0F172A" stroke-width="4" fill="none"/>

    <!-- Hair (Messy/Wavy) -->
    <path d="M170 200 
             C 150 150, 200 100, 256 110 
             C 320 100, 360 150, 342 200
             C 350 220, 340 240, 330 230
             L 330 180 
             C 330 140, 300 120, 256 120
             C 210 120, 180 140, 180 180
             L 180 230
             C 170 240, 160 220, 170 200 Z" fill="#0F172A" />

    <!-- Lanyard (Blue Strap) -->
    <path d="M190 400 Q 256 480 322 400" stroke="#2563EB" stroke-width="8" fill="none" />
    <rect x="236" y="460" width="40" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="241" y="465" width="30" height="15" fill="#2563EB" opacity="0.8" />
</svg>