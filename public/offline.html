<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeelEd AI — Offline</title>
  <style>
    body {
      background: #060610;
      color: #eeeef8;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #4a4a6a; font-size: 14px; max-width: 300px; line-height: 1.6; margin: 0 auto; }
    .btn {
      margin-top: 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="logo">📚</div>
  <h1>You're Offline</h1>
  <p>FeelEd AI needs an internet connection for AI-powered learning. Please check your connection and try again.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
  <p style="margin-top:16px;font-size:11px;color:#2a2a4a;">FeelEd AI — AI Learning for Students</p>
</body>
</html>
