
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeelEd AI | Learn Smarter</title>

    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="FeelEd AI | Professional Learning Portal" />
    <meta property="og:description" content="Restoring empathy in education through emotion-adaptive storytelling and research-backed pedagogical intelligence." />
    <meta property="og:image" content="/feeled-logo.webp" />
    <meta property="og:url" content="https://feeledai.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FeelEd AI | Emotion-Adaptive Education" />
    <meta name="twitter:description" content="An emotional story-based learning engine that converts any academic topic into a story-driven emotional learning experience." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FeelEd AI" />
    <link rel="icon" type="image/webp" href="/feeled-logo.webp" />
    <link rel="apple-touch-icon" href="/feeled-logo.webp" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        @keyframes logoReveal {
            0%   { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40%            { transform: scale(1);   opacity: 1; }
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            background: #0D0D0D;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #splash-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        #splash-logo {
            width: 112px;
            height: 112px;
            border-radius: 20px;
            object-fit: contain;
            animation: logoReveal 0.8s ease-out forwards;
        }
        #splash-title {
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 0.4s forwards;
        }
        #splash-dots {
            display: flex;
            gap: 8px;
            opacity: 0;
            animation: fadeUp 0.4s ease-out 0.7s forwards;
        }
        #splash-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4F46E5;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="min-h-screen">
    <div id="splash-screen">
        <img id="splash-logo" src="/feeled-logo.webp" alt="FeelEd AI" />
        <div id="splash-title">FeelEd AI</div>
        <div id="splash-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div id="root"></div>
    <script>
        setTimeout(function () {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('hide');
                setTimeout(function () { splash.remove(); }, 400);
            }
        }, 1800);
    </script>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
