<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeelEd AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* Magical Background Particles */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }
        
        /* Shimmer Pulse for the Badge */
        @keyframes shimmer {
            0% { background-position: -200% 0; box-shadow: 0 0 0px rgba(59,130,246,0); }
            50% { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
            100% { background-position: 200% 0; box-shadow: 0 0 0px rgba(59,130,246,0); }
        }
        .animate-shimmer {
            background: linear-gradient(90deg, #f0f9ff 0%, #dbeafe 25%, #f0f9ff 50%, #dbeafe 75%, #f0f9ff 100%);
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }

        /* Bubble Float Animation - More Dynamic */
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(2deg) scale(1.05); }
        }
        .animate-bubble-1 { animation: bubbleFloat 5s ease-in-out infinite; }
        .animate-bubble-2 { animation: bubbleFloat 5.5s ease-in-out infinite 0.3s; }
        .animate-bubble-3 { animation: bubbleFloat 6s ease-in-out infinite 0.6s; }

        /* Magical Shake/Wiggle - More Pronounced */
        @keyframes magicShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-1px, -1px) rotate(-1deg); }
            20% { transform: translate(1px, 1px) rotate(1deg); }
            30% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            40% { transform: translate(1px, -1px) rotate(0.5deg); }
        }
        .animate-magic-shake {
            display: inline-block;
            animation: magicShake 0.6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
