<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeelEd AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 40%, #bae6fd 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* Magical Background Particles Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 2px 2px, #3b82f6 1px, transparent 0);
            background-size: 60px 60px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
            animation: particleDrift 60s linear infinite;
        }

        @keyframes particleDrift {
            from { background-position: 0 0; }
            to { background-position: 500px 1000px; }
        }
        
        /* Shimmer Pulse for the Badge */
        @keyframes shimmerSweep {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .animate-shimmer {
            background: linear-gradient(90deg, #dbeafe 0%, #ffffff 50%, #dbeafe 100%);
            background-size: 200% 100%;
            animation: shimmerSweep 3s infinite linear;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        /* Bubble Float Animation */
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
            50% { transform: translateY(-20px) scale(1.05) rotate(1deg); }
        }
        .animate-bubble-1 { animation: bubbleFloat 5s ease-in-out infinite; }
        .animate-bubble-2 { animation: bubbleFloat 5.5s ease-in-out infinite 0.5s; }
        .animate-bubble-3 { animation: bubbleFloat 6s ease-in-out infinite 1s; }

        /* Magical Jitter Shake */
        @keyframes magicJitter {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-1px, -1px) rotate(-0.5deg); }
            30% { transform: translate(1px, 1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 1px) rotate(-0.2deg); }
            70% { transform: translate(1px, -1px) rotate(0.2deg); }
        }
        .animate-magic-shake {
            display: inline-block;
            animation: magicJitter 0.4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{

  }
}
</script>
</head>

</html>
